name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name YamahaStyleStudio main.py
      - uses: actions/upload-artifact@v4
        with:
          name: YamahaStyleStudio-Windows
          path: dist/YamahaStyleStudio.exe
          if-no-files-found: error
